<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<title>食事管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button id="prevDay" aria-label="前の日">‹</button>
  <div><h1 id="dateLabel"></h1><small id="modeBadge"></small></div>
  <button id="nextDay" aria-label="次の日">›</button>
</header>

<main>
  <section id="view-today" class="view">
    <div class="card summary">
      <div class="ring" id="ring"><div><b id="kcalNow">0</b><small id="kcalGoal">/ 0 kcal</small></div></div>
      <div class="macros" id="macros"></div>
    </div>
    <div class="card" id="warnings" hidden></div>

    <div class="row">
      <h2>食事</h2>
      <label class="btn primary" for="photo">📷 写真で記録</label>
      <input id="photo" type="file" accept="image/*" capture="environment" hidden>
      <button class="btn" id="manualAdd">＋ 手入力</button>
    </div>
    <div id="mealList"></div>

    <div class="card">
      <div class="row"><h2>AIアドバイス</h2><button class="btn" id="advice">今日の食事を評価</button></div>
      <div id="adviceBox" class="muted">食事を記録して「評価」を押すと、栄養バランスの講評と次の食事の提案を表示します。</div>
    </div>
  </section>

  <section id="view-history" class="view" hidden>
    <h2>直近7日間</h2>
    <div class="card"><canvas id="chart" height="180"></canvas></div>
    <div id="histList"></div>
  </section>

  <section id="view-settings" class="view" hidden>
    <h2>プロフィールと目標</h2>
    <form id="profileForm" class="card form">
      <label>性別<select name="sex"><option value="male">男性</option><option value="female">女性</option></select></label>
      <label>年齢<input name="age" type="number" min="10" max="100" required></label>
      <label>身長 (cm)<input name="height" type="number" min="100" max="230" required></label>
      <label>体重 (kg)<input name="weight" type="number" min="30" max="250" step="0.1" required></label>
      <label>活動量<select name="activity">
        <option value="1">低い(座位中心)</option><option value="2">やや低い(軽い運動)</option>
        <option value="3">ふつう(週3-5運動)</option><option value="4">高い(毎日運動)</option></select></label>
      <label>目的<select name="goal"><option value="lose">減量</option><option value="maintain">維持</option><option value="gain">増量</option></select></label>
      <button class="btn primary" type="submit">保存して目標を再計算</button>
    </form>
    <div class="card" id="targetBox"></div>
    <div class="card form">
      <h3>データ</h3>
      <button class="btn" id="exportBtn">JSONで書き出し</button>
      <button class="btn danger" id="clearBtn">全データを削除</button>
      <p class="muted">記録はこの端末のブラウザにのみ保存されます。写真は解析時のみサーバーへ送信され、端末にはサムネイルのみ保存されます。</p>
    </div>
  </section>
</main>

<nav class="tabs">
  <button data-view="today" class="active">今日</button>
  <button data-view="history">履歴</button>
  <button data-view="settings">設定</button>
</nav>

<dialog id="dlg">
  <form method="dialog" id="mealForm" class="form">
    <h3 id="dlgTitle">食事を確認</h3>
    <img id="preview" alt="" hidden>
    <p class="muted" id="aiComment"></p>
    <label>料理名<input name="name" required></label>
    <div class="grid2">
      <label>区分<select name="type"><option>朝食</option><option>昼食</option><option>夕食</option><option>間食</option></select></label>
      <label>kcal<input name="calories" type="number" min="0" step="1" required></label>
      <label>たんぱく質 g<input name="protein" type="number" min="0" step="0.1"></label>
      <label>脂質 g<input name="fat" type="number" min="0" step="0.1"></label>
      <label>炭水化物 g<input name="carbs" type="number" min="0" step="0.1"></label>
      <label>食物繊維 g<input name="fiber" type="number" min="0" step="0.1"></label>
      <label>糖質 g<input name="sugar" type="number" min="0" step="0.1"></label>
      <label>ナトリウム mg<input name="sodium" type="number" min="0" step="1"></label>
    </div>
    <ul id="items" class="items"></ul>
    <div class="row end">
      <button class="btn danger" type="button" id="delMeal" hidden>削除</button>
      <button class="btn" value="cancel" formnovalidate>キャンセル</button>
      <button class="btn primary" value="ok" id="saveMeal">保存</button>
    </div>
  </form>
</dialog>
<div id="loading" hidden><div class="spin"></div><p>解析中…</p></div>
<div id="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
